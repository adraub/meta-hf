# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-hf"
BBFILE_PATTERN_meta-hf = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-hf = "9"

LAYERVERSION_meta-hf = "1"
LAYERSERIES_COMPAT_meta-hf = "wrynose"

# Declare direct dependency on meta-python-ai and core
LAYERDEPENDS_meta-hf = "core meta-python-ai"