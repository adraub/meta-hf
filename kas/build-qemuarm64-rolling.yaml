header:
  version: 14
  includes:
    - base.yaml

machine: qemuarm64

local_conf_header:
  resource-limits: |
    # BB_NUMBER_THREADS: How many recipes BitBake compiles in parallel
    # BB_NUMBER_THREADS = "3"
    
    # PARALLEL_MAKE: How many CPU cores are used *within* an individual compilation task (e.g., make -j 3)
    # PARALLEL_MAKE = "-j 3"
