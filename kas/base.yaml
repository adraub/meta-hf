header:
  version: 14

distro: poky
target: core-image-base

repos:
  # BitBake was decoupled and uses numerical branch versions (2.18 for Wrynose)
  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers: {}
    path: "build/layers/bitbake"

  # Core metadata now comes directly from openembedded-core
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    path: "build/layers/openembedded-core"
    layers:
      meta:

  # The Poky distro and BSP metadata were moved to meta-yocto
  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    path: "build/layers/meta-yocto"
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: "wrynose"
    path: "build/layers/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-filesystems:
      meta-networking:

  meta-clang:
    url: "https://github.com/kraj/meta-clang.git"
    branch: "wrynose"
    path: "build/layers/meta-clang"

  meta-clang-revival:
    url: "https://github.com/zboszor/meta-clang-revival.git"
    branch: "wrynose"
    path: "build/layers/meta-clang-revival"

  meta-python-ai:
    url: "https://github.com/zboszor/meta-python-ai.git"
    branch: "wrynose"
    path: "build/layers/meta-python-ai"

  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    branch: "wrynose"
    path: "build/layers/meta-virtualization"

  meta-hf:
    url: "https://github.com/adraub/meta-hf.git"
    branch: "wrynose"
    path: "build/layers/meta-hf"

local_conf_header:
  python-ai-scipy-support: |
    # 1. Enable FORTRAN support for cross-compiling python3-scipy
    FORTRAN:forcevariable = ",fortran"
    RUNTIMETARGET:append:pn-gcc-runtime = " libquadmath"
    HOSTTOOLS += "gfortran"

    # 2. Configure OpenBLAS to satisfy python3-scipy requirements
    PACKAGECONFIG:pn-openblas = "lapack cblas affinity dynarch"
    PACKAGECONFIG:pn-openblas-native = "lapack cblas affinity dynarch"

  license-acceptance: |
    # Accept commercial license for ffmpeg, required by torchvision
    LICENSE_FLAGS_ACCEPTED:append = " commercial"

  opencl-support: |
    # Add opencl support for pytorch
    DISTRO_FEATURES:append = " opencl"

  debug-tweaks: |
    # Makes image suitable for development (e.g. passwordless root login)
    EXTRA_IMAGE_FEATURES ?= "empty-root-password allow-root-login allow-empty-password"

  image_append: |
      IMAGE_INSTALL:append = " python3 python3-evaluate python3-transformers python3-diffusers python3-llama-cpp python3-kernels"
